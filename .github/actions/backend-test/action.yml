name: Backend Test
description: Start CockroachDB and MongoDB from compose.yaml, then run go vet and go test

runs:
  using: composite
  steps:
    - name: Start CockroachDB and MongoDB
      shell: bash
      run: |
        set -euo pipefail

        docker compose -f compose.yaml up -d --wait --wait-timeout 120 crdb mongo || {
          docker compose -f compose.yaml logs crdb mongo
          exit 1
        }

        {
          echo "DATABASE_URL=postgresql://root@localhost:26257/defaultdb?sslmode=disable"
          echo "MONGO_URI=mongodb://localhost:27017/financy?directConnection=true"
        } >> "${GITHUB_ENV}"

    - name: Setup Go
      uses: actions/setup-go@v7
      with:
        go-version-file: go.mod
        cache-dependency-path: go.sum

    - name: Vet
      shell: bash
      run: go vet ./...

    - name: Test
      shell: bash
      run: go test ./... -count=1 -timeout 15m
